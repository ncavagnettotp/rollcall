<!doctype html>
<html lang="en"{% block html_attributes %}{% if theme_of(request) %} data-theme="{{ theme_of(request) }}"{% endif %}{% endblock %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {# htmx would otherwise inject an inline <style>, which the content security policy blocks. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}{% endblock %} · Rollcall</title>
  <link rel="stylesheet" href="{{ assets.pico_css }}">
  <link rel="stylesheet" href="{{ assets.app_css }}">
  <script src="{{ assets.htmx_js }}" defer></script>
  <script src="{{ assets.app_js }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% if mockup %}
  <div class="mockup-banner" role="note">
    <div class="container">
      <strong>Mockup: sample data</strong>
      <span>{{ mockup.title }}</span>
      <a href="{{ mockup.index_url }}">All mockups</a>
    </div>
  </div>
  {% endif %}
  <header class="container">
    <nav>
      <ul>
        <li><a href="{{ mockup.home_url if mockup else '/' }}" class="brand"><strong>Rollcall</strong></a></li>
      </ul>
      <ul>
        {% for item in nav_items %}
        <li><a href="{{ item.url }}"{% if item.is_current(request.url.path) %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
        <li class="theme-switch">
          {#- Light / Dark / Device (add-ui-components design.md decision 9). -#}
          <form method="post" action="/theme">
            <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
            <div role="group" aria-label="Colour mode">
              {%- set chosen = theme_of(request) or "device" %}
              {%- for value, label in (("light", "Light"), ("dark", "Dark"), ("device", "Device")) %}
              <button type="submit" name="mode" value="{{ value }}" aria-pressed="{{ 'true' if value == chosen else 'false' }}">{{ label }}</button>
              {%- endfor %}
            </div>
          </form>
        </li>
        {% if signed_in %}
        <li class="signed-in">
          <form method="post" action="{{ signed_in.sign_out_url }}">
            <small>{{ signed_in.name }}</small>
            <button type="submit" class="outline secondary">Sign out</button>
          </form>
        </li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    <div id="messages" aria-live="polite">{% block messages %}{% endblock %}</div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
