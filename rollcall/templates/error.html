{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<article>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if code %}<p>Reference code: <strong><code>{{ code }}</code></strong></p>{% endif %}
  <footer><a href="/">Back to the start page</a></footer>
</article>
{% endblock %}
